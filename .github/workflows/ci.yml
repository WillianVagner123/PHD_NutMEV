name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pytest ruff requests pandas openpyxl beautifulsoup4
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q tests
